name: Checks

# Lints and tests the tooling itself (not your layout).
on:
  push:
    branches: [main]
    paths: ["scripts/**", "tests/**", ".github/workflows/**", "Makefile", "modules/**", "custom/modules/**", ".oryx-overlay-manifest", ".oryx-overlay-version"]
  pull_request:
    paths: ["scripts/**", "tests/**", ".github/workflows/**", "Makefile", "modules/**", "custom/modules/**", ".oryx-overlay-manifest", ".oryx-overlay-version"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - name: Install linters
        run: pip install -q pytest shellcheck-py actionlint-py
      - name: shellcheck
        run: shellcheck -x scripts/*.sh
      - name: actionlint
        run: actionlint
      - name: pytest
        run: python -m pytest -q tests
