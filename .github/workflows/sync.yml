name: Sync from Oryx

on:
  workflow_dispatch:
  # Checks Oryx every 6 hours (UTC), but only once you opt in: set the repository
  # variable ORYX_SYNC_SCHEDULE to true (Settings > Secrets and variables > Actions >
  # Variables). Until then scheduled runs skip straight away.
  schedule:
    - cron: "17 */6 * * *"

permissions:
  contents: write

# A scheduled run that is going to skip gets a group of its own, so it can never
# replace a sync that is queued behind a running one.
concurrency:
  group: ${{ (github.event_name == 'schedule' && vars.ORYX_SYNC_SCHEDULE != 'true') && format('sync-skip-{0}', github.run_id) || 'sync' }}
  cancel-in-progress: false

jobs:
  sync:
    if: github.event_name != 'schedule' || vars.ORYX_SYNC_SCHEDULE == 'true'
    runs-on: ubuntu-24.04
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"

      - name: Sync
        id: sync
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # Keep the exit code for the summary: 3 is a merge conflict, anything else an error.
          rc=0
          scripts/sync.sh --push --ci || rc=$?
          echo "exit_code=$rc" >> "$GITHUB_OUTPUT"
          exit "$rc"

      - name: Summary
        if: always()
        run: |
          {
            if [ "${{ steps.sync.outcome }}" = "success" ]; then
              echo "## Synced from Oryx"
              echo
              git log -1 --format='%B' oryx
            elif [ "${{ steps.sync.outputs.exit_code }}" = "3" ]; then
              echo "## Sync stopped: merge conflict"
              echo
              echo "Oryx's latest export conflicts with your edits in \`layout/\`."
              echo "The new export is on the \`oryx\` branch. Resolve locally with \`make sync\`, or ask Claude Code: \`/oryx-sync\`."
            else
              echo "## Sync failed"
              echo
              echo "The sync stopped with an error (exit code \`${{ steps.sync.outputs.exit_code }}\`), not a merge conflict. Nothing was merged into your branch."
              echo "Read the **Sync** step's log: it says what went wrong and what to do. The export may or may not have reached the \`oryx\` branch."
            fi
          } >> "$GITHUB_STEP_SUMMARY"

  build:
    needs: sync
    uses: ./.github/workflows/build.yml
    permissions:
      contents: write
