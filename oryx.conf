# oryx-overlay settings. Read by the scripts and by CI.
# Anything set in the environment overrides this file for one run,
# e.g. `KEYBOARD=moonlander/revb make build`.

# Your Oryx layout ID: the part after /layouts/ in the Oryx URL, e.g.
#   https://configure.zsa.io/moonlander/layouts/AbC12/latest/0  ->  AbC12
# The layout must be public. "default" is ZSA's stock Moonlander layout.
ORYX_LAYOUT_ID=default

# Your board as named in ZSA's QMK fork (without the zsa/ prefix):
#   moonlander/reva   Moonlander shipped before mid-December 2025
#   moonlander/revb   Moonlander revision B (bootloader shows "Moonlander Bootloader")
#   voyager
#   ergodox_ez/stm32/glow, ergodox_ez/m32u4/shine, planck_ez/glow, ...
KEYBOARD=moonlander/reva

# Folder name for the keymap inside the QMK tree. Any slug.
KEYMAP_NAME=oryx-overlay

# Modifier legends in the drawings: pc (Ctrl/Alt/Super) or mac (⌃ ⌥ ⌘).
LEGEND_STYLE=pc
