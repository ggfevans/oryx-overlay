<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>__TITLE__ · keymap</title>
<meta name="description" content="Interactive keymap and lighting viewer generated by oryx-overlay">
<style>
  :root {
    --bg: #f4f3ef; --surface: #ffffff; --surface-2: #faf9f6; --ink: #1d1d1f; --muted: #6b6a66;
    --line: #e4e2dc; --accent: #6d5dfc; --accent-ink: #ffffff; --shadow: 0 1px 2px rgba(0,0,0,.05), 0 8px 24px rgba(0,0,0,.06);
    --ok: #1f8a4c; --warn: #b26a00; --off: #8a8a93;
    --radius: 14px; --mono: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
    --desk: #101014; --desk-line: #26262c;
  }
  @media (prefers-color-scheme: dark) {
    :root { --bg: #141416; --surface: #1c1c1f; --surface-2: #232327; --ink: #ececef; --muted: #9a99a3;
      --line: #2f2f35; --accent: #8b7dff; --accent-ink: #0f0f12; --shadow: 0 1px 2px rgba(0,0,0,.4), 0 8px 24px rgba(0,0,0,.35);
      --ok: #4cc983; --warn: #f0a93b; --off: #7c7c86; --desk: #0b0b0e; }
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; background: var(--bg); color: var(--ink);
    font: 15px/1.5 ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
  .wrap { max-width: 1180px; margin: 0 auto; padding: 28px 16px 48px; }
  header { display: flex; flex-wrap: wrap; align-items: baseline; gap: 8px 16px; margin-bottom: 18px; }
  h1 { font-size: 26px; line-height: 1.2; margin: 0; letter-spacing: -0.01em; }
  .chips { display: flex; flex-wrap: wrap; gap: 6px; }
  .chip { font-size: 12px; color: var(--muted); background: var(--surface); border: 1px solid var(--line);
    border-radius: 999px; padding: 2px 10px; white-space: nowrap; }
  .chip b { color: var(--ink); font-weight: 600; }
  nav { display: flex; flex-wrap: wrap; gap: 6px; margin: 0 0 14px; align-items: center; }
  nav button { display: inline-flex; align-items: center; gap: 8px; font: inherit; font-size: 14px; cursor: pointer;
    color: var(--ink); background: var(--surface); border: 1px solid var(--line); border-radius: 10px; padding: 7px 12px;
    transition: border-color .15s, background .15s; }
  nav button:hover { border-color: var(--accent); }
  nav button[aria-selected="true"] { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
  nav .dot { width: 10px; height: 10px; border-radius: 50%; background: var(--dot, var(--line)); box-shadow: 0 0 0 1px rgba(0,0,0,.12) inset; }
  nav kbd { font: 11px var(--mono); opacity: .6; }
  nav .sep { width: 1px; align-self: stretch; background: var(--line); margin: 2px 4px; }
  nav .spark { width: 14px; height: 14px; border-radius: 4px;
    background: conic-gradient(from 90deg, #ff4d4d, #ffb84d, #e8ff4d, #4dff88, #4dd2ff, #6d5dfc, #ff4dd8, #ff4d4d); }
  .board { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); box-shadow: var(--shadow);
    padding: 12px; overflow-x: auto; }
  .board svg { display: block; width: 100%; height: auto; min-width: 640px; }
  .board svg .key { cursor: pointer; }
  .board svg .key:hover rect.key, .board svg .key.pinned rect.key { stroke: var(--accent) !important; stroke-width: 2.5px !important; }
  .grid { display: grid; grid-template-columns: minmax(0, 1.2fr) minmax(0, 1fr); gap: 14px; margin-top: 14px; }
  @media (max-width: 820px) { .grid { grid-template-columns: 1fr; } }
  .card { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); padding: 16px 18px; box-shadow: var(--shadow); }
  .card h2 { font-size: 13px; text-transform: uppercase; letter-spacing: .06em; color: var(--muted); margin: 0 0 10px; font-weight: 600; }
  code { font: 13px var(--mono); background: var(--surface-2); border: 1px solid var(--line); border-radius: 6px; padding: 1px 6px; word-break: break-all; }
  .inspect .legend { font-size: 28px; font-weight: 700; line-height: 1.15; min-height: 32px; }
  .inspect .hold { color: var(--muted); font-size: 14px; margin-top: 2px; }
  .inspect dl { display: grid; grid-template-columns: max-content 1fr; gap: 6px 14px; margin: 14px 0 0; }
  .inspect dt { color: var(--muted); font-size: 13px; }
  .inspect dd { margin: 0; }
  .hint { color: var(--muted); font-size: 14px; }
  .access ul { list-style: none; margin: 0; padding: 0; display: grid; gap: 8px; }
  .access li { display: flex; gap: 10px; align-items: baseline; }
  .access .name { font-weight: 600; min-width: 7em; }
  .access .how { color: var(--muted); font-size: 14px; }
  .checks { margin-top: 12px; padding-top: 12px; border-top: 1px solid var(--line); font-size: 14px; }
  .checks p { margin: 4px 0; }

  /* ---- lighting -------------------------------------------------------- */
  .stage { position: relative; background: var(--desk); border: 1px solid var(--desk-line); border-radius: var(--radius);
    box-shadow: var(--shadow); padding: 18px; overflow: hidden; }
  .stage canvas { display: block; width: 100%; height: auto; cursor: pointer; }
  .stage .caption { position: absolute; left: 18px; bottom: 12px; font-size: 12px; color: #9a99a3; pointer-events: none; }
  .stage .caption b { color: #ececef; font-weight: 600; }
  .light-grid { display: grid; grid-template-columns: minmax(0, 1.3fr) minmax(0, 1fr); gap: 14px; margin-top: 14px; }
  @media (max-width: 820px) { .light-grid { grid-template-columns: 1fr; } }
  .effect-name { font-size: 26px; font-weight: 700; line-height: 1.2; margin: 0 0 6px; }
  .badge { display: inline-flex; align-items: center; gap: 6px; font-size: 12px; font-weight: 600; border-radius: 999px;
    padding: 2px 10px; border: 1px solid currentColor; }
  .badge::before { content: ""; width: 7px; height: 7px; border-radius: 50%; background: currentColor; }
  .badge.on { color: var(--ok); } .badge.oryx { color: var(--warn); } .badge.off { color: var(--off); }
  .detail p { margin: 10px 0 0; }
  .snippet { display: flex; gap: 8px; align-items: center; margin-top: 8px; flex-wrap: wrap; }
  .snippet code { font-size: 13px; padding: 4px 8px; }
  button.copy { font: inherit; font-size: 13px; cursor: pointer; border-radius: 8px; border: 1px solid var(--line);
    background: var(--surface-2); color: var(--ink); padding: 4px 10px; }
  button.copy:hover { border-color: var(--accent); }
  .controls label { display: grid; grid-template-columns: 7.5em 1fr 3em; align-items: center; gap: 10px; font-size: 14px; margin: 8px 0; }
  .controls output { font: 13px var(--mono); color: var(--muted); text-align: right; }
  .controls input[type=range] { width: 100%; accent-color: var(--accent); }
  .controls input.hue { accent-color: var(--hue, var(--accent)); }
  .controls .row { display: flex; justify-content: space-between; align-items: center; margin-top: 10px; gap: 8px; flex-wrap: wrap; }
  .filters { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; margin: 22px 0 10px; }
  .filters h2 { font-size: 13px; text-transform: uppercase; letter-spacing: .06em; color: var(--muted); margin: 0 10px 0 0; font-weight: 600; }
  .filters button { font: inherit; font-size: 13px; cursor: pointer; border-radius: 999px; border: 1px solid var(--line);
    background: var(--surface); color: var(--ink); padding: 3px 12px; }
  .filters button[aria-pressed="true"] { background: var(--ink); color: var(--bg); border-color: var(--ink); }
  .callout { border: 1px solid var(--warn); background: color-mix(in srgb, var(--warn) 10%, transparent); border-radius: 10px;
    padding: 10px 12px; margin: 12px 0 0; font-size: 14px; }
  .callout b { color: var(--warn); }
  .group-title { font-size: 14px; font-weight: 600; margin: 18px 0 8px; color: var(--muted); }
  .group-title:first-child { margin-top: 0; }
  .gallery { display: grid; grid-template-columns: repeat(auto-fill, minmax(210px, 1fr)); gap: 12px; }
  .tile { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 8px; cursor: pointer;
    text-align: left; font: inherit; color: inherit; transition: border-color .15s, transform .15s; }
  .tile:hover { border-color: var(--accent); transform: translateY(-1px); }
  .tile[aria-current="true"] { border-color: var(--accent); box-shadow: 0 0 0 2px var(--accent) inset; }
  .tile canvas { display: block; width: 100%; height: auto; border-radius: 8px; background: var(--desk); }
  .tile .meta { display: flex; justify-content: space-between; align-items: center; gap: 6px; padding: 8px 2px 2px; }
  .tile .label { font-size: 14px; font-weight: 600; }
  .tile .pip { width: 8px; height: 8px; border-radius: 50%; flex: none; }
  .tile .pip.on { background: var(--ok); } .tile .pip.oryx { background: var(--warn); } .tile .pip.off { background: var(--off); }
  .tile .react { font-size: 11px; color: var(--muted); }
  footer { margin-top: 22px; color: var(--muted); font-size: 13px; }
  footer a { color: inherit; }
  [hidden] { display: none !important; }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1 id="title"></h1>
    <div class="chips" id="chips"></div>
  </header>
  <nav id="tabs" role="tablist" aria-label="Layers and lighting"></nav>

  <div id="keymap-view">
    <div class="board" id="board" role="tabpanel"></div>
    <div class="grid">
      <section class="card inspect" aria-live="polite">
        <h2>Key</h2>
        <div id="inspect"><p class="hint">Hover or tap a key to see what it does. Number keys switch layers.</p></div>
      </section>
      <section class="card access">
        <h2>How to reach each layer</h2>
        <ul id="access"></ul>
        <div class="checks" id="checks" hidden></div>
      </section>
    </div>
  </div>

  <div id="light-view" hidden>
    <div class="stage">
      <canvas id="stage" aria-label="Lighting preview on your keyboard"></canvas>
      <div class="caption" id="caption"></div>
    </div>
    <div class="light-grid">
      <section class="card detail" aria-live="polite">
        <h2>Effect</h2>
        <div id="detail"></div>
      </section>
      <section class="card controls">
        <h2>Preview settings</h2>
        <label>Colour <input type="range" id="c-h" class="hue" min="0" max="255"><output id="o-h"></output></label>
        <label>Saturation <input type="range" id="c-s" min="0" max="255"><output id="o-s"></output></label>
        <label>Brightness <input type="range" id="c-v" min="0" max="255"><output id="o-v"></output></label>
        <label>Speed <input type="range" id="c-speed" min="0" max="255"><output id="o-speed"></output></label>
        <div class="row">
          <span class="hint" id="defaults-note"></span>
          <button class="copy" id="reset">Firmware defaults</button>
        </div>
      </section>
    </div>
    <div class="filters" id="filters">
      <h2>All effects</h2>
      <button data-f="all" aria-pressed="true">All</button>
      <button data-f="on" aria-pressed="false">In your firmware</button>
      <button data-f="out" aria-pressed="false">Not built in</button>
    </div>
    <div id="gallery"></div>
  </div>

  <footer id="footer">Drawn from <code>layout/keymap.c</code> by oryx-overlay with keymap-drawer. Key tints are the colours Oryx lights them.</footer>
</div>
<script id="data" type="application/json">__DATA__</script>
<script>/*__RGB_ENGINE__*/</script>
<script>
(() => {
  const data = JSON.parse(document.getElementById("data").textContent);
  const initialHash = location.hash; // read before anything calls history.replaceState
  const L = data.lighting && window.OryxRGB ? data.lighting : null;
  const $ = (id) => document.getElementById(id);
  const esc = (s) => String(s ?? "").replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
  let current = 0, pinned = null, mode = "keys";

  $("title").textContent = data.title;
  $("chips").innerHTML = data.chips.map(([k, v]) => `<span class="chip">${esc(k)} <b>${esc(v)}</b></span>`).join("");

  $("tabs").innerHTML = data.layers.map((l, i) =>
    `<button role="tab" data-i="${i}" style="--dot:${l.colour || "transparent"}" aria-selected="false">` +
    `<span class="dot"></span>${esc(l.name)}${i < 9 ? `<kbd>${i + 1}</kbd>` : ""}</button>`).join("") +
    (L ? `<span class="sep"></span><button role="tab" data-light="1" aria-selected="false"><span class="spark"></span>Lighting<kbd>L</kbd></button>` : "");
  $("tabs").addEventListener("click", (e) => {
    const b = e.target.closest("button");
    if (!b) return;
    if (b.dataset.light) showLighting(); else show(+b.dataset.i);
  });

  $("access").innerHTML = data.access.map((a) =>
    `<li><span class="name">${esc(a.name)}</span><span class="how">${a.how.length ? a.how.map(esc).join("<br>") : "not reachable from any key"}</span></li>`).join("");
  if (data.checks.length) {
    $("checks").hidden = false;
    $("checks").innerHTML = data.checks.map(([lvl, msg]) => `<p>${lvl === "error" ? "❌" : "⚠️"} ${esc(msg)}</p>`).join("");
  }

  function describe(k, layer) {
    if (!k) return `<p class="hint">Hover or tap a key to see what it does.</p>`;
    const legend = k.kind === "trans" ? "▽" : k.kind === "none" ? "·" : k.tap;
    const what = {
      trans: "Transparent: falls through to the layer below.",
      none: "No key.",
      layer: k.hold ? "Tap for the legend, hold for the layer." : "Changes layer.",
      mod: k.hold ? "Tap for the legend, hold for the modifier." : "",
      special: "Oryx macro, tap dance or firmware function.",
    }[k.kind] || "";
    return `<div class="legend">${esc(legend) || "&nbsp;"}</div>` +
      (k.hold ? `<div class="hold">hold: ${esc(k.hold)}</div>` : "") +
      `<dl><dt>Layer</dt><dd>${esc(layer.name)}</dd>` +
      `<dt>Position</dt><dd>${esc(k.pos)}</dd>` +
      `<dt>Keycode</dt><dd><code>${esc(k.raw)}</code></dd>` +
      (k.resolved && k.resolved !== k.raw ? `<dt>Expands to</dt><dd><code>${esc(k.resolved)}</code></dd>` : "") +
      (what ? `<dt>Does</dt><dd>${esc(what)}</dd>` : "") + `</dl>`;
  }

  function keyIndex(el) {
    const g = el.closest("g.key");
    if (!g) return null;
    const m = [...g.classList].find((c) => c.startsWith("keypos-"));
    return m ? +m.slice(7) : null;
  }

  function selectTab(which) {
    [...$("tabs").querySelectorAll("button")].forEach((b) =>
      b.setAttribute("aria-selected", String(which === "light" ? !!b.dataset.light : +b.dataset.i === which && !b.dataset.light)));
  }

  function show(i) {
    mode = "keys"; current = i; pinned = null;
    selectTab(i);
    $("keymap-view").hidden = false; $("light-view").hidden = true;
    $("board").innerHTML = data.layers[i].svg;
    $("inspect").innerHTML = describe(null);
    try { history.replaceState(null, "", "#" + encodeURIComponent(data.layers[i].name)); } catch (e) {}
  }

  const board = $("board");
  board.addEventListener("mouseover", (e) => {
    if (pinned !== null) return;
    const idx = keyIndex(e.target);
    if (idx !== null) $("inspect").innerHTML = describe(data.layers[current].keys[idx], data.layers[current]);
  });
  board.addEventListener("click", (e) => {
    const idx = keyIndex(e.target);
    board.querySelectorAll("g.key.pinned").forEach((g) => g.classList.remove("pinned"));
    if (idx === null || idx === pinned) { pinned = null; return; }
    pinned = idx;
    e.target.closest("g.key").classList.add("pinned");
    $("inspect").innerHTML = describe(data.layers[current].keys[idx], data.layers[current]);
  });

  // ======================================================================
  // Lighting
  // ======================================================================
  let showLighting = () => {};
  if (L) {
    const R = window.OryxRGB;
    const byKey = Object.fromEntries(L.effects.map((e) => [e.key, e]));
    const maxV = 255;
    const defaults = { h: L.startup.h, s: L.startup.s, v: 255, speed: L.startup.speed };
    const cfg = { ...defaults };
    let selected = (L.effects.find((e) => e.status === "on" && e.key !== "solid_color") || L.effects[0]).key;
    let filter = "all";

    // ---- board geometry -> canvas ------------------------------------------
    const U = 54, GAP = 5, PAD = 10;
    const keyBoxes = L.keys.map((k) => ({ ...k }));
    const bounds = keyBoxes.reduce((b, k) => ({
      x0: Math.min(b.x0, k.x), y0: Math.min(b.y0, k.y), x1: Math.max(b.x1, k.x + k.w), y1: Math.max(b.y1, k.y + k.h),
    }), { x0: Infinity, y0: Infinity, x1: -Infinity, y1: -Infinity });
    const W = (bounds.x1 - bounds.x0) * U + PAD * 2, H = (bounds.y1 - bounds.y0) * U + PAD * 2;
    const ledsWithKeys = keyBoxes.filter((k) => k.led !== null && k.led !== undefined);
    // LEDs with no key (underglow) are drawn as dots at their LED position.
    const keyed = new Set(ledsWithKeys.map((k) => k.led));
    const glowDots = L.leds.map((l, i) => ({ i, l })).filter(({ i }) => !keyed.has(i));

    const gamma = (c) => Math.round(255 * Math.pow(c / 255, 0.72));
    function draw(ctx, buf, scale, opts) {
      ctx.setTransform(scale, 0, 0, scale, 0, 0);
      ctx.fillStyle = "#101014"; ctx.fillRect(0, 0, W, H);
      for (const k of keyBoxes) {
        const x = (k.x - bounds.x0) * U + PAD, y = (k.y - bounds.y0) * U + PAD, w = k.w * U - GAP, h = k.h * U - GAP;
        ctx.save();
        if (k.r) {
          const rx = (k.rx - bounds.x0) * U + PAD, ry = (k.ry - bounds.y0) * U + PAD;
          ctx.translate(rx, ry); ctx.rotate((k.r * Math.PI) / 180); ctx.translate(-rx, -ry);
        }
        let r = 0, g = 0, b = 0;
        if (k.led !== null && k.led !== undefined) { r = gamma(buf[k.led * 3]); g = gamma(buf[k.led * 3 + 1]); b = gamma(buf[k.led * 3 + 2]); }
        const lit = r + g + b > 24;
        ctx.fillStyle = "#1d1d23";
        roundRect(ctx, x, y, w, h, 7); ctx.fill();
        if (lit) {
          if (opts.glow) { ctx.shadowColor = `rgba(${r},${g},${b},.85)`; ctx.shadowBlur = 16; }
          ctx.fillStyle = `rgb(${r},${g},${b})`;
          roundRect(ctx, x + 2, y + 2, w - 4, h - 4, 6); ctx.fill();
          ctx.shadowBlur = 0;
          // keycap sheen
          const grad = ctx.createLinearGradient(0, y, 0, y + h);
          grad.addColorStop(0, "rgba(255,255,255,.18)"); grad.addColorStop(1, "rgba(0,0,0,.18)");
          ctx.fillStyle = grad; roundRect(ctx, x + 2, y + 2, w - 4, h - 4, 6); ctx.fill();
        }
        if (opts.labels && k.label) {
          const lum = 0.299 * r + 0.587 * g + 0.114 * b;
          ctx.fillStyle = lit && lum > 140 ? "rgba(0,0,0,.72)" : "rgba(255,255,255,.72)";
          ctx.font = `600 ${k.label.length > 3 ? 11 : 14}px ui-sans-serif, system-ui, sans-serif`;
          ctx.textAlign = "center"; ctx.textBaseline = "middle";
          ctx.fillText(k.label.length > 7 ? k.label.slice(0, 6) + "…" : k.label, x + w / 2, y + h / 2);
        }
        if (opts.flash && opts.flash.has(k)) {
          ctx.strokeStyle = "rgba(255,255,255,.7)"; ctx.lineWidth = 2; roundRect(ctx, x + 1, y + 1, w - 2, h - 2, 7); ctx.stroke();
        }
        ctx.restore();
      }
      for (const { i, l } of glowDots) {
        const r = gamma(buf[i * 3]), g = gamma(buf[i * 3 + 1]), b = gamma(buf[i * 3 + 2]);
        const x = PAD + (l.x / 224) * (W - PAD * 2), y = PAD + (l.y / 64) * (H - PAD * 2);
        ctx.fillStyle = `rgb(${r},${g},${b})`; ctx.beginPath(); ctx.arc(x, y, 4, 0, Math.PI * 2); ctx.fill();
      }
    }
    function roundRect(ctx, x, y, w, h, r) {
      ctx.beginPath(); ctx.moveTo(x + r, y); ctx.arcTo(x + w, y, x + w, y + h, r); ctx.arcTo(x + w, y + h, x, y + h, r);
      ctx.arcTo(x, y + h, x, y, r); ctx.arcTo(x, y, x + w, y, r); ctx.closePath();
    }
    const newEngine = (key) => {
      const eng = R.createEngine({ leds: L.leds, center: L.center, matrix: L.matrix });
      eng.setConfig(cfg); eng.setEffect(key);
      return eng;
    };

    // ---- stage ----------------------------------------------------------------
    const stage = $("stage"), sctx = stage.getContext("2d");
    const dpr = Math.min(2, window.devicePixelRatio || 1);
    stage.width = Math.round(W * dpr); stage.height = Math.round(H * dpr);
    let stageEngine = newEngine(selected);
    const flash = new Map();
    let lastUserKey = -1e9, ghostAt = 0;

    function press(k, now) {
      if (k.led === null || k.led === undefined) return;
      stageEngine.hit(k.led);
      flash.set(k, now + 140);
      setTimeout(() => stageEngine.hit(k.led), 90); // QMK also reacts to the release
    }
    function keyAt(evt) {
      const rect = stage.getBoundingClientRect();
      const px = ((evt.clientX - rect.left) / rect.width) * W, py = ((evt.clientY - rect.top) / rect.height) * H;
      return keyBoxes.find((k) => {
        let qx = px, qy = py;
        if (k.r) { // undo the key's rotation around (rx, ry), as draw() applies it
          const rx = (k.rx - bounds.x0) * U + PAD, ry = (k.ry - bounds.y0) * U + PAD, a = (-k.r * Math.PI) / 180;
          qx = rx + (px - rx) * Math.cos(a) - (py - ry) * Math.sin(a);
          qy = ry + (px - rx) * Math.sin(a) + (py - ry) * Math.cos(a);
        }
        const x = (k.x - bounds.x0) * U + PAD, y = (k.y - bounds.y0) * U + PAD;
        return qx >= x && qx <= x + k.w * U && qy >= y && qy <= y + k.h * U;
      });
    }
    stage.addEventListener("pointerdown", (e) => { const k = keyAt(e); if (k) { lastUserKey = performance.now(); press(k, lastUserKey); } });

    // Physical keyboard -> the key on this layout's base layer that sends it.
    const CODE = {
      Space: ["KC_SPACE", "KC_SPC"], Enter: ["KC_ENTER", "KC_ENT"], Backspace: ["KC_BSPC", "KC_BACKSPACE"], Tab: ["KC_TAB"],
      Escape: ["KC_ESCAPE", "KC_ESC"], ArrowLeft: ["KC_LEFT"], ArrowRight: ["KC_RIGHT", "KC_RGHT"], ArrowUp: ["KC_UP"],
      ArrowDown: ["KC_DOWN"], Minus: ["KC_MINUS", "KC_MINS"], Equal: ["KC_EQUAL", "KC_EQL"], BracketLeft: ["KC_LBRC", "KC_LEFT_BRACKET"],
      BracketRight: ["KC_RBRC", "KC_RIGHT_BRACKET"], Backslash: ["KC_BSLS", "KC_BACKSLASH"], Semicolon: ["KC_SCLN", "KC_SEMICOLON"],
      Quote: ["KC_QUOTE", "KC_QUOT"], Backquote: ["KC_GRAVE", "KC_GRV"], Comma: ["KC_COMMA", "KC_COMM"], Period: ["KC_DOT"],
      Slash: ["KC_SLASH", "KC_SLSH"], ShiftLeft: ["KC_LEFT_SHIFT", "KC_LSFT"], ShiftRight: ["KC_RIGHT_SHIFT", "KC_RSFT"],
      ControlLeft: ["KC_LEFT_CTRL", "KC_LCTL"], ControlRight: ["KC_RIGHT_CTRL", "KC_RCTL"], AltLeft: ["KC_LEFT_ALT", "KC_LALT"],
      AltRight: ["KC_RIGHT_ALT", "KC_RALT"], MetaLeft: ["KC_LEFT_GUI", "KC_LGUI"], MetaRight: ["KC_RIGHT_GUI", "KC_RGUI"],
      Delete: ["KC_DELETE", "KC_DEL"], Home: ["KC_HOME"], End: ["KC_END"], PageUp: ["KC_PAGE_UP", "KC_PGUP"], PageDown: ["KC_PAGE_DOWN", "KC_PGDN"],
      CapsLock: ["KC_CAPS", "KC_CAPS_LOCK"],
    };
    function keyForCode(code) {
      let names = CODE[code];
      if (!names) {
        let m;
        if ((m = /^Key([A-Z])$/.exec(code))) names = ["KC_" + m[1]];
        else if ((m = /^Digit(\d)$/.exec(code))) names = ["KC_" + m[1]];
        else if ((m = /^(F\d{1,2})$/.exec(code))) names = ["KC_" + m[1]];
        else names = [];
      }
      const hit = ledsWithKeys.find((k) => names.includes(k.kc));
      if (hit) return hit;
      // Not on the base layer (or a hold key): light a stable pseudo-random key instead.
      let h = 0; for (const ch of code) h = (h * 31 + ch.charCodeAt(0)) >>> 0;
      return ledsWithKeys[h % ledsWithKeys.length];
    }
    const typingKeys = new Set();
    document.addEventListener("keydown", (e) => {
      if (mode !== "light" || e.metaKey || e.ctrlKey || e.target.closest("input, button, textarea")) return;
      if (e.repeat) { e.preventDefault(); return; }
      e.preventDefault();
      const k = keyForCode(e.code);
      if (k) { lastUserKey = performance.now(); stageEngine.hit(k.led); flash.set(k, lastUserKey + 140); typingKeys.add(e.code); }
    });
    document.addEventListener("keyup", (e) => {
      if (mode !== "light" || !typingKeys.has(e.code)) return;
      typingKeys.delete(e.code);
      const k = keyForCode(e.code);
      if (k) stageEngine.hit(k.led);
    });

    // ---- detail + controls ----------------------------------------------------------
    const STATUS = { on: "In your firmware", oryx: "Turned off in Oryx", off: "Not built in" };
    function copyButton(text) { return `<button class="copy" data-copy="${esc(text)}">Copy</button>`; }
    function renderDetail() {
      const e = byKey[selected];
      const reactive = R.EFFECTS.find((x) => x.key === e.key)?.reactive;
      let how = "";
      if (e.status === "on") {
        how = e.cycle === 0
          ? `<p>This is the first effect in the cycle.</p>`
          : `<p>Press <b>RGB Mode</b> ${e.cycle} time${e.cycle === 1 ? "" : "s"} from Solid Color to reach it. The keyboard remembers your choice.</p>`;
        how += L.modeKeys.length
          ? `<p class="hint">Your RGB Mode key: ${L.modeKeys.map(esc).join("; ")}.</p>`
          : `<p class="hint">Your layout has no RGB Mode key yet. Add one in Oryx (keycode <code>RGB_MODE_FORWARD</code>) to cycle effects.</p>`;
      } else {
        const line = `#define ${e.define}`;
        how = (e.status === "oryx"
          ? `<p>Oryx leaves this effect out of your firmware. Tick it in Oryx under <b>Advanced Settings › RGB</b>, compile, and flash. Or build it in from this repo by adding this line to <code>custom/config.h</code>:</p>`
          : `<p>To build it in, add this to <code>custom/config.h</code>:</p>`) +
          `<div class="snippet"><code>${esc(line)}</code>${copyButton(line)}</div>` +
          `<p class="hint">Each effect costs a little flash space. After building, it joins the RGB Mode cycle.</p>`;
      }
      let note = "";
      if (L.baseColoured) {
        note = `<div class="callout"><b>Your layer colours hide effects.</b> Every layer with Oryx key colours (${L.oryxColours.map(esc).join(", ")}) ` +
          `repaints all the LEDs, and uncoloured keys go dark, so no effect shows through. ` +
          (L.toggleKeys.length
            ? `Press <b>Toggle Layer Colors</b> (${L.toggleKeys.map(esc).join("; ")}) to see effects, or clear the base layer's colours in Oryx.`
            : `Add a <b>Toggle Layer Colors</b> key in Oryx, or clear the base layer's colours.`) + `</div>`;
      } else if (L.oryxColours.length) {
        note = `<p class="hint">While ${L.oryxColours.map(esc).join(", ")} ${L.oryxColours.length === 1 ? "is" : "are"} active, Oryx's key colours for that layer replace the effect.</p>`;
      }
      $("detail").innerHTML =
        `<div class="effect-name">${esc(e.label)}</div>` +
        `<span class="badge ${e.status}">${STATUS[e.status]}</span>` + note +
        (reactive ? `<p><b>Reacts to typing.</b> Type on your keyboard or click keys on the board above.</p>` : "") +
        how + `<p class="hint">QMK name: <code>${esc(e.key.toUpperCase())}</code></p>`;
      $("caption").innerHTML = `<b>${esc(e.label)}</b>${reactive ? " · type or click keys" : ""}`;
    }
    $("detail").addEventListener("click", (e) => {
      const b = e.target.closest("[data-copy]");
      if (!b) return;
      const text = b.dataset.copy;
      const done = () => { b.textContent = "Copied"; setTimeout(() => (b.textContent = "Copy"), 1400); };
      if (navigator.clipboard) navigator.clipboard.writeText(text).then(done, () => {}); else done();
    });

    const sliders = ["h", "s", "v", "speed"];
    function syncControls() {
      for (const k of sliders) { $("c-" + k).value = cfg[k]; $("o-" + k).textContent = cfg[k]; }
      const [r, g, b] = R.hsv2rgb(cfg.h, 255, 255);
      $("c-h").style.setProperty("--hue", `rgb(${r},${g},${b})`);
      $("defaults-note").textContent = `Firmware start-up speed ${L.startup.speed}` + (L.startup.h ? `, colour ${L.startup.h}` : "") +
        (L.timeoutMs ? `. LEDs sleep after ${L.timeoutMs >= 60000 ? Math.round(L.timeoutMs / 60000) + " min" : Math.round(L.timeoutMs / 1000) + " s"} idle.` : ".");
    }
    for (const k of sliders) {
      $("c-" + k).addEventListener("input", (e) => {
        cfg[k] = +e.target.value;
        stageEngine.setConfig(cfg);
        tiles.forEach((t) => t.engine.setConfig(cfg));
        syncControls();
      });
    }
    $("reset").addEventListener("click", () => {
      Object.assign(cfg, defaults);
      stageEngine.setConfig(cfg); tiles.forEach((t) => t.engine.setConfig(cfg)); syncControls();
    });

    // ---- gallery ------------------------------------------------------------------
    const GROUPS = [
      ["Static", ["solid_color", "alphas_mods", "gradient_up_down", "gradient_left_right"]],
      ["Colour bands", ["band_sat", "band_val", "band_pinwheel_sat", "band_pinwheel_val", "band_spiral_sat", "band_spiral_val"]],
      ["Rainbow", ["cycle_all", "cycle_left_right", "cycle_up_down", "rainbow_moving_chevron", "cycle_out_in", "cycle_out_in_dual",
                   "cycle_pinwheel", "cycle_spiral", "dual_beacon", "rainbow_beacon", "rainbow_pinwheels", "flower_blooming"]],
      ["Waves and breathing", ["breathing", "hue_breathing", "hue_pendulum", "hue_wave", "riverflow"]],
      ["Ambient", ["raindrops", "jellybean_raindrops", "pixel_rain", "pixel_flow", "pixel_fractal", "digital_rain",
                   "starlight_smooth", "starlight", "starlight_dual_sat", "starlight_dual_hue"]],
      ["Reactive", ["typing_heatmap", "solid_reactive_simple", "solid_reactive", "solid_reactive_wide", "solid_reactive_multiwide",
                    "solid_reactive_cross", "solid_reactive_multicross", "solid_reactive_nexus", "solid_reactive_multinexus",
                    "splash", "multisplash", "solid_splash", "solid_multisplash"]],
    ];
    const grouped = new Set(GROUPS.flatMap(([, ks]) => ks));
    const extra = L.effects.filter((e) => !grouped.has(e.key)).map((e) => e.key);
    if (extra.length) GROUPS.push(["Other", extra]);
    const groupEls = GROUPS.map(([title, ks]) => {
      const wrap = document.createElement("section");
      wrap.innerHTML = `<div class="group-title">${esc(title)}</div><div class="gallery"></div>`;
      $("gallery").appendChild(wrap);
      return { wrap, grid: wrap.querySelector(".gallery"), keys: ks };
    });
    const TW = 360, TH = Math.round((360 * H) / W);
    const tiles = L.effects.map((e) => {
      const btn = document.createElement("button");
      btn.className = "tile"; btn.dataset.key = e.key;
      const reactive = R.EFFECTS.find((x) => x.key === e.key)?.reactive;
      btn.innerHTML = `<canvas width="${TW}" height="${TH}"></canvas><div class="meta"><span class="label">${esc(e.label)}</span>` +
        `${reactive ? `<span class="react">reactive</span>` : ""}<span class="pip ${e.status}" title="${STATUS[e.status]}"></span></div>`;
      (groupEls.find((g) => g.keys.includes(e.key)) || groupEls[groupEls.length - 1]).grid.appendChild(btn);
      return { e, btn, reactive, ctx: btn.querySelector("canvas").getContext("2d"), engine: newEngine(e.key), visible: false, nextGhost: 0 };
    });
    const io = "IntersectionObserver" in window
      ? new IntersectionObserver((entries) => entries.forEach((en) => {
          const t = tiles.find((x) => x.btn === en.target); if (t) t.visible = en.isIntersecting;
        }), { rootMargin: "80px" })
      : null;
    tiles.forEach((t) => (io ? io.observe(t.btn) : (t.visible = true)));
    // A first frame for every tile, so none is ever blank (and all that reduced motion shows).
    const reduceMotion = window.matchMedia && matchMedia("(prefers-reduced-motion: reduce)").matches;
    tiles.forEach((t) => {
      if (t.reactive) for (let j = 0; j < 4; j++) t.engine.hit(ledsWithKeys[(j * 7919) % ledsWithKeys.length].led);
      draw(t.ctx, t.engine.step(1200 + ((t.e.key.length * 97) % 900)), TW / W, { glow: false, labels: false });
    });
    groupEls.forEach((g) => (g.wrap.hidden = !g.grid.children.length));
    $("gallery").addEventListener("click", (ev) => {
      const b = ev.target.closest(".tile"); if (!b) return;
      select(b.dataset.key);
      document.querySelector(".stage").scrollIntoView({ behavior: "smooth", block: "nearest" });
    });
    $("filters").addEventListener("click", (ev) => {
      const b = ev.target.closest("button[data-f]"); if (!b) return;
      filter = b.dataset.f;
      [...$("filters").querySelectorAll("button")].forEach((x) => x.setAttribute("aria-pressed", String(x === b)));
      tiles.forEach((t) => (t.btn.hidden = filter === "on" ? t.e.status !== "on" : filter === "out" ? t.e.status === "on" : false));
      groupEls.forEach((g) => (g.wrap.hidden = ![...g.grid.children].some((b) => !b.hidden)));
    });
    const onCount = L.effects.filter((e) => e.status === "on").length;
    $("filters").querySelector('[data-f="on"]').textContent = `In your firmware (${onCount})`;
    $("filters").querySelector('[data-f="out"]').textContent = `Not built in (${L.effects.length - onCount})`;

    function select(key) {
      selected = key;
      stageEngine = newEngine(key);
      tiles.forEach((t) => t.btn.setAttribute("aria-current", String(t.e.key === key)));
      renderDetail();
      try { history.replaceState(null, "", "#lighting/" + key); } catch (e) {}
    }

    // ---- animation loop ----------------------------------------------------------------
    let prev = performance.now(), running = false;
    function loop(now) {
      if (mode !== "light") { running = false; return; }
      const dt = Math.min(100, now - prev); prev = now;
      const stageReactive = R.EFFECTS.find((x) => x.key === selected)?.reactive;
      if (stageReactive && now - lastUserKey > 4000 && now > ghostAt) {
        press(ledsWithKeys[(Math.random() * ledsWithKeys.length) | 0], now);
        ghostAt = now + 220 + Math.random() * 380;
      }
      for (const [k, until] of flash) if (until < now) flash.delete(k);
      draw(sctx, stageEngine.step(dt), dpr, { glow: true, labels: true, flash: new Set(flash.keys()) });
      for (const t of tiles) {
        if (reduceMotion || !t.visible || t.btn.hidden) continue;
        if (t.reactive && now > t.nextGhost) {
          const k = ledsWithKeys[(Math.random() * ledsWithKeys.length) | 0];
          t.engine.hit(k.led); setTimeout(() => t.engine.hit(k.led), 90);
          t.nextGhost = now + 260 + Math.random() * 420;
        }
        draw(t.ctx, t.engine.step(dt), TW / W, { glow: false, labels: false });
      }
      requestAnimationFrame(loop);
    }

    showLighting = () => {
      mode = "light";
      selectTab("light");
      $("keymap-view").hidden = true; $("light-view").hidden = false;
      $("footer").innerHTML = "Lighting previews run a JavaScript port of QMK's RGB Matrix effects (GPL-2.0-or-later) on your board's LED map. Colours on screen approximate the LEDs.";
      if (!running) { running = true; prev = performance.now(); requestAnimationFrame(loop); }
      try { history.replaceState(null, "", "#lighting/" + selected); } catch (e) {}
    };
    syncControls();
    select(selected);
  }

  document.addEventListener("keydown", (e) => {
    if (e.metaKey || e.ctrlKey || e.altKey || e.target.closest("input, textarea")) return;
    if (mode === "light") {
      if (e.key === "Escape") show(current);
      return;
    }
    if ((e.key === "l" || e.key === "L") && L) { showLighting(); return; }
    const n = parseInt(e.key, 10);
    if (n >= 1 && n <= Math.min(9, data.layers.length)) show(n - 1);
    if (e.key === "ArrowRight") show((current + 1) % data.layers.length);
    if (e.key === "ArrowLeft") show((current - 1 + data.layers.length) % data.layers.length);
  });

  const lightHash = /^#lighting(?:\/(\w+))?$/.exec(initialHash);
  const fromHash = data.layers.findIndex((l) => "#" + encodeURIComponent(l.name) === initialHash);
  show(fromHash >= 0 ? fromHash : 0);
  if (lightHash && L) {
    showLighting();
    if (lightHash[1] && L.effects.some((e) => e.key === lightHash[1])) {
      document.querySelector(`.tile[data-key="${lightHash[1]}"]`)?.click();
    }
  }
})();
</script>
</body>
</html>
